name: CI

# Yohu ADB Tools v6 — 持续集成流水线（架构文档 §11.3）
# 触发：push / PR 到 main；手动 workflow_dispatch。
# 验收门槛与 CLAUDE.md「发布检查清单」一致（1/2/3/7 项自动化）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 验证（Rust）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: sidecar adb（下载官方 platform-tools）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-adb.ps1

      - name: Rust 构建（含 fake-adb 明文 bin）
        run: cargo build --workspace

      - name: Rust 测试（含 fake-adb 集成）
        run: cargo test --workspace

      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
