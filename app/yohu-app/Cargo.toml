[package]
name = "yohu-app"
description = "Yohu ADB Tools v6 — Tauri 桌面壳（组合根，唯一引用 Tauri 的 crate）"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
time.workspace = true
yohu-protocol.workspace = true
yohu-domain.workspace = true
yohu-adb.workspace = true
yohu-logsrv.workspace = true
yohu-files.workspace = true

[lib]
name = "yohu_app_lib"
crate-type = ["lib"]
