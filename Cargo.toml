[workspace]
resolver = "2"
members = [
  "core/yohu-protocol",
  "core/yohu-domain",
  "core/yohu-adb",
  "core/yohu-logsrv",
  "core/yohu-files",
  "core/yohu-update",
  "app/yohu-app",
  "tools/fake-adb",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# 体积优化（G1 轻量化：安装包 ≤ 12 MB）
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tracing = "0.1"
time = { version = "0.3", features = ["formatting", "local-offset"] }

yohu-protocol = { path = "core/yohu-protocol" }
yohu-domain = { path = "core/yohu-domain" }
yohu-adb = { path = "core/yohu-adb" }
yohu-logsrv = { path = "core/yohu-logsrv" }
yohu-files = { path = "core/yohu-files" }
yohu-update = { path = "core/yohu-update" }
